<style>
/* Layout: one-screen app — side rail on desktop, bottom tab bar on phone; sheets slide over for records. */
:root{
  --bg:#F5F7F5; --surface:#FFFFFF; --sunk:#ECF0ED; --line:#DCE3DE;
  --ink:#16211D; --muted:#5D6B65; --accent:#1F6F55; --accent-ink:#FFFFFF; --accent-soft:#DDEFE7;
  --warn:#B4740F; --warn-soft:#FBEFD9; --bad:#B23B3B; --bad-soft:#F8E1E1; --good:#1F7A4A; --good-soft:#DDF1E5;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  --r:12px; --shadow:0 1px 2px rgba(16,33,29,.06),0 8px 24px rgba(16,33,29,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1412; --surface:#151E1B; --sunk:#1B2622; --line:#28362F;
  --ink:#E4ECE8; --muted:#94A59D; --accent:#4FB38E; --accent-ink:#06130E; --accent-soft:#18352A;
  --warn:#E3A645; --warn-soft:#3A2C12; --bad:#E57373; --bad-soft:#3A1C1C; --good:#5BC58A; --good-soft:#163323;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.35rem} h2{font-size:1.1rem} h3{font-size:.98rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:.84rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 1rem var(--f-display)}
.brand b{font-family:var(--f-display);font-size:1.05rem}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:start;width:100%;color:var(--muted);font-weight:500}
.nav svg{width:20px;height:20px;flex:none}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav:hover:not(.on){background:var(--sunk);color:var(--ink)}
.rail .spacer{flex:1}
main{overflow:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabbar{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{display:none}
  main{padding-block:14px 24px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar .nav{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 2px;justify-content:center}
}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .label{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.kpi .val{font-size:1.35rem;font-family:var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .sub{font-size:.78rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:.84rem;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item.click{cursor:pointer}
.item.click:hover{background:var(--sunk)}
.ico{width:34px;height:34px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--muted)}
.ico svg{width:18px;height:18px}
.ico.call{color:#2F6FB0} .ico.whatsapp{color:#1E9E5A} .ico.email{color:#8A5BB8} .ico.meeting,.ico.visit{color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.new{background:var(--sunk)} .chip.contacted{background:#E3ECF7;color:#2F5F94}
.chip.qualified,.chip.customer,.chip.won{background:var(--good-soft);color:var(--good)}
.chip.unqualified,.chip.lost,.chip.overdue{background:var(--bad-soft);color:var(--bad)}
.chip.draft,.chip.due{background:var(--warn-soft);color:var(--warn)}
@media (prefers-color-scheme:dark){.chip.contacted{background:#1B2B3F;color:#8AB6E8}}
.score{font-family:var(--f-num);font-size:.8rem;min-width:34px;text-align:center;padding:2px 6px;border-radius:6px;background:var(--sunk)}
.score.hi{background:var(--good-soft);color:var(--good)} .score.mid{background:var(--warn-soft);color:var(--warn)} .score.lo{background:var(--bad-soft);color:var(--bad)}
.title{font-weight:600;overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.section-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;gap:8px}
.section-h h2{font-size:1rem}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1;min-width:160px}
.search select{width:auto}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(640px,100%);height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;z-index:2}
.sheet-body{padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (max-width:760px){.scrim{align-items:flex-end}.sheet{height:94%;border-radius:16px 16px 0 0}}

/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px;gap:6px}
.col-h b{font-family:var(--f-display);font-weight:600;font-size:.92rem}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.deal:hover{border-color:var(--accent)}
.prob{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prob i{display:block;height:100%;background:var(--accent)}

/* forecast */
.qtable{width:100%;border-collapse:collapse;min-width:560px}
.qtable th,.qtable td{padding:10px 12px;border-top:1px solid var(--line);text-align:start;white-space:nowrap}
.qtable th{font-size:.78rem;color:var(--muted);font-weight:500;border-top:0}
.qtable td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:12px;padding:16px}
.bar-row{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}
.bar-track{position:relative;height:26px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar-track .w{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);opacity:.9}
.bar-track .o{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);opacity:.25}
.bar-track .lbl{position:absolute;inset-inline-start:8px;top:50%;transform:translateY(-50%);font:500 .78rem var(--f-num);color:var(--ink)}
.bar-track .tgt{position:absolute;inset-block:0;width:2px;background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);padding:0 16px 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;background:var(--accent)}

/* agent */
.chat{display:flex;flex-direction:column;height:calc(100% - 0px);min-height:0}
.chat-wrap{display:flex;flex-direction:column;gap:12px;height:100%}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px;min-height:260px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.msg.user{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-end-start-radius:4px}
.msg.assistant{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:4px}
[dir=ltr] .msg.user{align-self:flex-end} [dir=ltr] .msg.assistant{align-self:flex-start}
.msg .meta{display:block;margin-top:6px;font-size:.74rem;color:var(--muted)}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.composer textarea{border:0;min-height:44px;max-height:160px;padding:8px;outline:none}
.composer textarea:focus{outline:none}
.composer .btn{flex:none;width:44px;height:44px;padding:0}
.composer .btn svg{width:20px;height:20px}
.head .btn.ghost svg{width:22px;height:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer;color:var(--muted)}
.chips button:hover{color:var(--ink);border-color:var(--accent)}
.typing{align-self:flex-end;color:var(--muted);font-size:.85rem;padding:4px 10px}
[dir=ltr] .typing{align-self:flex-start}

/* auth */
.auth{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.auth .card{width:min(400px,100%);padding:26px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem;box-shadow:var(--shadow)}
.timeline .item{padding:10px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.contact-actions a{font-size:.82rem}
.mobile-only{display:none}
@media (max-width:760px){.mobile-only{display:inline}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateY(12px);opacity:.6}}}
</style>

async function loadAll(){
  const [st,ins,op,ac,cd,hk,us] = await Promise.all([
    sb.from("settings").select("*").maybeSingle(),
    sb.from("institutions").select("*").order("updated_at",{ascending:false}).limit(2000),
    sb.from("opportunities").select("*").order("updated_at",{ascending:false}),
    sb.from("activities").select("*").order("created_at",{ascending:false}).limit(3000),
    sb.from("cadences").select("*").order("created_at"),
    sb.rpc("has_api_key"),
    sb.from("agent_usage").select("cost_usd").gte("created_at", new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString())
  ]);
  S.settings=st.data||{default_price:300,commission_pct:20,agent_monthly_budget_usd:10,agent_model:"claude-haiku-5-5"};
  S.insts=ins.data||[]; S.opps=op.data||[]; S.acts=ac.data||[]; S.cadences=cd.data||[]; S.hasKey=!!hk.data;
  S.usage=(us.data||[]).reduce((a,x)=>a+Number(x.cost_usd),0);
}

/* today */
function todayView(){
  const cq=curQ(), td=todayStr(), now=new Date();
  const open=S.opps.filter(o=>!["won","lost"].includes(o.stage));
  const qOpen=open.filter(o=>qOf(o.expected_close)===cq);
  const wonQ=S.opps.filter(o=>o.stage==="won"&&qOf(o.closed_at)===cq);
  const wComm=qOpen.reduce((a,o)=>a+o.commission*o.probability/100,0)+wonQ.reduce((a,o)=>a+Number(o.commission),0);
  const planned=S.acts.filter(a=>a.status==="planned"&&a.due_at).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at));
  const overdue=planned.filter(a=>cairoDay(a.due_at)<td), dueToday=planned.filter(a=>cairoDay(a.due_at)===td);
  const drafts=S.acts.filter(a=>a.status==="draft");
  const tgt=Number(S.settings.quarterly_target_egp||0);
  return `<div class="page">${pageHead(t("today"), `<span class="muted small">${new Date().toLocaleDateString(LANG==="ar"?"ar-EG":"en-GB",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"})}</span>`)}
  <div class="kpis">
    <div class="card kpi"><span class="label">${t("qComm")} · ${cq}</span><span class="val">${money(wComm)}</span><span class="sub">${tgt?`${t("target")}: ${money(tgt)} · ${Math.round(wComm/tgt*100)}%`:`${t("wonV")}: ${money(wonQ.reduce((a,o)=>a+Number(o.commission),0))}`}</span></div>
    <div class="card kpi"><span class="label">${t("openPipe")}</span><span class="val">${money(open.reduce((a,o)=>a+Number(o.amount),0))}</span><span class="sub">${fmt(open.length)} ${t("deals")}</span></div>
    <div class="card kpi"><span class="label">${t("wonQ")}</span><span class="val">${money(wonQ.reduce((a,o)=>a+Number(o.amount),0))}</span><span class="sub">${fmt(wonQ.length)} ${t("deals")}</span></div>

/* forecast */
function forecastRows(){
  const by={}; const add=k=>by[k]??={deals:0,value:0,weighted:0,commW:0,won:0,commWon:0};
  for(const o of S.opps){ if(o.stage==="lost") continue;
    const k = o.stage==="won"? (qOf(o.closed_at)||"–") : (qOf(o.expected_close)||"–"); const b=add(k); b.deals++;
    if(o.stage==="won"){b.won+=+o.amount;b.commWon+=+o.commission}else{b.value+=+o.amount;b.weighted+=o.amount*o.probability/100;b.commW+=o.commission*o.probability/100}}
  // always show current + next 3 quarters
  const d=new Date(); for(let i=0;i<4;i++){const x=new Date(d.getFullYear(),d.getMonth()+i*3,1);add(qOf(x))}
  return Object.entries(by).sort(([a],[b])=>a==="–"?1:b==="–"?-1:a.localeCompare(b)) }
function forecastView(){
  const rows=forecastRows(), tgt=Number(S.settings.quarterly_target_egp||0);
  const max=Math.max(1,tgt,...rows.map(([,b])=>b.commWon+b.value*(S.settings.commission_pct||20)/100));
  return `<div class="page">${pageHead(t("forecast"))}
  <section class="card"><div class="section-h"><h2>${t("commW")} / ${t("quarter")}</h2></div>
    <div class="bars">${rows.filter(([k])=>k!=="–").map(([k,b])=>{const firm=b.commWon+b.commW, open=b.commWon+b.value*(S.settings.commission_pct||20)/100;
      return `<div class="bar-row"><span class="num small">${k}</span><div class="bar-track"><div class="o" style="width:${open/max*100}%"></div><div class="w" style="width:${firm/max*100}%"></div>${tgt?`<div class="tgt" style="inset-inline-start:${tgt/max*100}%"></div>`:""}<span class="lbl">${money(firm)}</span></div></div>`}).join("")}</div>
    <div class="legend"><span><i></i>${t("commW")} + ${t("commWon")}</span><span><i style="opacity:.25"></i>${t("openPipe")}</span>${tgt?`<span><i style="background:var(--warn);width:3px"></i>${t("target")} ${money(tgt)}</span>`:""}</div></section>
  <section class="card"><div class="scroll-x"><table class="qtable"><thead><tr><th>${t("quarter")}</th><th>${t("deals")}</th><th>${t("value")}</th><th>${t("weighted")}</th><th>${t("wonV")}</th><th>${t("commW")}</th><th>${t("commWon")}</th></tr></thead>
    <tbody>${rows.map(([k,b])=>`<tr><td class="n">${k==="–"?t("noDate"):k}</td><td class="n">${fmt(b.deals)}</td><td class="n">${fmt(b.value)}</td><td class="n">${fmt(b.weighted)}</td><td class="n">${fmt(b.won)}</td><td class="n">${fmt(b.commW)}</td><td class="n">${fmt(b.commWon)}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted" style="padding:0 16px 14px;margin:0">${t("fcNote")} ${t("egp")}.</p></section></div>` }

  ${!S.hasKey?`<div class="card pad small" style="background:var(--warn-soft);border-color:transparent">${t("noKey")} <a href="#settings" data-nav="settings">${t("settings")}</a></div>`:""}

    ${S.chat.map(m=>`<div class="msg ${m.role}">${esc(m.content)}${m.meta?`<span class="meta">${esc(m.meta)}</span>`:""}</div>`).join("")}
    ${S.busy?`<div class="typing">${t("thinking")}</div>`:""}</div>

async function loadChat(){ const d=await q(sb.from("agent_messages").select("role,content,created_at").order("created_at",{ascending:false}).limit(40)); S.chat=d.reverse() }
async function sendAgent(text){
  if(!text.trim()||S.busy) return; S.chat.push({role:"user",content:text}); S.busy=true; render();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(`${SUPABASE_URL}/functions/v1/agent`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${session.access_token}`,apikey:SUPABASE_KEY},body:JSON.stringify({message:text})});
    const j=await r.json();
    if(!r.ok){ S.chat.push({role:"assistant",content: j.error==="missing_api_key"?t("noKey"): j.error==="budget"?t("budgetHit"): (j.message||"Error")}) }
    else { S.chat.push({role:"assistant",content:j.reply||"✓",meta:`${t("cost")}: $${j.usage.cost_usd.toFixed(4)}${j.usage.web_searches?` · 🔎 ${j.usage.web_searches}`:""}`}); S.usage=j.usage.month_spent_usd;
      if(j.actions?.length) await loadAll() }
  }catch(e){ S.chat.push({role:"assistant",content:String(e.message||e)}) }
  S.busy=false; render(); setTimeout(()=>$("#cin")?.focus(),30)
}

    <div class="row"><button class="btn sm" type="button" id="addStep">${icon("plus")}${t("addStep")}</button></div>
    <div class="row" style="justify-content:space-between"><button class="btn primary" type="submit">${t("save")}</button>${c.id?`<button class="btn ghost danger" type="button" id="delCad">${t("del")}</button>`:""}</div></form>` }
function stepRow(s,ix){ return `<div class="row step" style="flex-wrap:nowrap"><input type="number" min="0" class="st-day" aria-label="${t("day")}" value="${s.day??0}" style="width:70px;flex:none">
  <select class="st-type" aria-label="${t("type")}" style="width:auto;flex:none">${[...ACTS,"task"].map(a=>`<option value="${a}" ${a===s.type?"selected":""}>${t("a_"+a)}</option>`).join("")}</select>
  <input class="st-title grow" aria-label="${t("subject")}" value="${esc(s.title||"")}"><input type="hidden" class="st-hint" value="${esc(s.hint||"")}"><button type="button" class="btn ghost sm danger st-del" aria-label="${t("del")}">${icon("x")}</button></div>` }

/* ---------- bindings ---------- */
function bindCommon(scope){
  scope.querySelectorAll("[data-open]").forEach(el=>el.onclick=async e=>{e.preventDefault();e.stopPropagation();await openInst(el.dataset.open)});
  scope.querySelectorAll("[data-done]").forEach(b=>b.onclick=async e=>{e.stopPropagation();const id=b.dataset.done;await q(sb.from("activities").update({status:"done",done_at:new Date().toISOString()}).eq("id",id));const a=S.acts.find(x=>x.id===id);if(a){a.status="done";a.done_at=new Date().toISOString()}toast(t("done"));render()});
  scope.querySelectorAll("[data-opp]").forEach(b=>b.onclick=()=>openSheet("opp",b.dataset.opp));
  scope.querySelectorAll("[data-nav]").forEach(b=>b.onclick=e=>{e.preventDefault();S.sheet=null;S.view=b.dataset.nav;location.hash=S.view;render()});
}
async function openInst(id){ S._contacts=await q(sb.from("contacts").select("*").eq("institution_id",id).order("created_at")); openSheet("inst",id) }
function bindView(){
  const m=$("#main"); bindCommon(m);
  if(S.view==="today"){
    m.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const a=S.acts.find(x=>x.id===b.dataset.copy);try{await navigator.clipboard.writeText((a.subject?a.subject+"\n\n":"")+a.body);toast(t("copied"))}catch(e){toast(a.body)}});
    m.querySelectorAll("[data-sent]").forEach(b=>b.onclick=async()=>{const id=b.dataset.sent;await q(sb.from("activities").update({status:"sent",done_at:new Date().toISOString()}).eq("id",id));const a=S.acts.find(x=>x.id===id);a.status="sent";
      if(a.institution_id){const i=instById(a.institution_id);if(i&&i.status==="new"){i.status="contacted";await sb.from("institutions").update({status:"contacted"}).eq("id",i.id)}}toast(t("markSent"));render()});
    m.querySelectorAll("[data-del-act]").forEach(b=>b.onclick=async()=>{if(b.dataset.armed){await q(sb.from("activities").delete().eq("id",b.dataset.delAct));S.acts=S.acts.filter(x=>x.id!==b.dataset.delAct);render()}else{b.dataset.armed=1;b.textContent=t("confirmDel")}});
  }
  if(S.view==="leads"){
    $("#newLead").onclick=()=>openSheet("instForm",null);
    $("#fq").oninput=e=>{S.filter.q=e.target.value;const pos=e.target.selectionStart;render();const el=$("#fq");el.focus();el.setSelectionRange(pos,pos)};
    $("#fs").onchange=e=>{S.filter.status=e.target.value;render()}; $("#fc").onchange=e=>{S.filter.city=e.target.value;render()};
    m.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{S.filter.status=b.dataset.st;render()});
  }
  if(S.view==="pipeline") $("#newOpp").onclick=()=>openSheet("opp",null,{inst:""});
  if(S.view==="agent"){
    $("#composer").onsubmit=e=>{e.preventDefault();const v=$("#cin").value;$("#cin").value="";sendAgent(v)};
    $("#cin").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&window.matchMedia("(min-width:761px)").matches){e.preventDefault();$("#composer").requestSubmit()}};
    $("#cin").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(160,e.target.scrollHeight)+"px"};
    m.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>sendAgent(b.dataset.q));
    $("#newChat").onclick=async()=>{const {data:{session}}=await sb.auth.getSession();await fetch(`${SUPABASE_URL}/functions/v1/agent`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${session.access_token}`,apikey:SUPABASE_KEY},body:JSON.stringify({reset:true})});S.chat=[];render()};
  }
  if(S.view==="settings"){
    $("#signout").onclick=async()=>{await sb.auth.signOut()};
    $("#s_lang").onchange=e=>setLang(e.target.value);
    $("#setForm").onsubmit=async e=>{e.preventDefault();
      const key=$("#s_key").value.trim();
      if(key){ const ex=S.hasKey; await q(ex? sb.from("api_keys").update({anthropic_key:key,updated_at:new Date().toISOString()}).eq("owner_id",S.user.id) : sb.from("api_keys").insert({anthropic_key:key})); S.hasKey=true }
      const patch={agent_model:$("#s_model").value,agent_monthly_budget_usd:+$("#s_budget").value||0,default_price:+$("#s_price").value||0,commission_pct:+$("#s_comm").value||0,quarterly_target_egp:+$("#s_tgt").value||0,sender_name:$("#s_sn").value,sender_email:$("#s_se").value,signature:$("#s_sig").value,updated_at:new Date().toISOString()};
      const d=await q(sb.from("settings").upsert({owner_id:S.user.id,...patch}).select().single()); S.settings=d; toast(t("saved")); render() };
    $("#newCad").onclick=()=>openSheet("cad",null);
    m.querySelectorAll("[data-cad]").forEach(b=>b.onclick=()=>openSheet("cad",b.dataset.cad));
  }
}
function bindSheet(){
  const sc=$("#scrim"); bindCommon(sc.querySelector(".sheet-body"));
  $("#closeSheet").onclick=closeSheet; sc.onclick=e=>{if(e.target===sc)closeSheet()};
  document.onkeydown=e=>{if(e.key==="Escape"&&S.sheet)closeSheet()};
  const s=S.sheet;
  if(s.kind==="inst"){ const i=instById(s.id);
    $("#i_status").onchange=async e=>{await q(sb.from("institutions").update({status:e.target.value}).eq("id",i.id));i.status=e.target.value;render()};
    sc.querySelector("[data-edit-inst]").onclick=()=>openSheet("instForm",i.id);
    $("#tglContact").onclick=()=>{const f=$("#contactForm");f.hidden=!f.hidden;if(!f.hidden)$("#c_name").focus()};
    $("#contactForm").onsubmit=async e=>{e.preventDefault();const c=await q(sb.from("contacts").insert(clean({institution_id:i.id,full_name:$("#c_name").value,role:$("#c_role").value,phone:$("#c_phone").value,whatsapp:$("#c_wa").value,email:$("#c_email").value,decision_role:$("#c_dr").value})).select().single());S._contacts.push(c);render()};
    sc.querySelectorAll("[data-del-contact]").forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed=1;b.textContent=t("confirmDel");return}await q(sb.from("contacts").delete().eq("id",b.dataset.delContact));S._contacts=S._contacts.filter(c=>c.id!==b.dataset.delContact);render()});
    sc.querySelectorAll("[data-new-opp]").forEach(b=>b.onclick=()=>openSheet("opp",null,{inst:i.id,back:i.id}));
    $("#a_mode").onchange=e=>{$("#a_dueWrap").hidden=e.target.value!=="planned"};
    $("#actForm").onsubmit=async e=>{e.preventDefault();const planned=$("#a_mode").value==="planned";
      const row=clean({institution_id:i.id,type:$("#a_type").value,subject:$("#a_subj").value,body:$("#a_body").value,status:planned?"planned":"done",due_at:planned?fromLocalInput($("#a_due").value):null,done_at:planned?null:new Date().toISOString()});
      const a=await q(sb.from("activities").insert(row).select().single());S.acts.unshift(a);
      if(!planned&&i.status==="new"){await sb.from("institutions").update({status:"contacted"}).eq("id",i.id);i.status="contacted"}
      toast(t("saved"));render()};
    const eb=$("#enrollBtn"); if(eb) eb.onclick=async()=>{const cid=$("#cadPick").value;if(!cid)return;await q(sb.rpc("enroll_in_cadence",{p_cadence:cid,p_institution:i.id,p_contact:S._contacts[0]?.id||null}));await loadAll();toast(t("enrolled"));render()};
  }
  if(s.kind==="instForm"){
    $("#instForm").onsubmit=async e=>{e.preventDefault();const g=k=>$("#f_"+k).value.trim();
      const row={name:g("name"),name_en:g("name_en")||null,type:g("type"),category:g("category")||null,fees_level:g("fees_level")||null,city:g("city")||null,area:g("area")||null,students_count:g("students_count")?+g("students_count"):null,phone:g("phone")||null,email:g("email")||null,website:g("website")||null,address:g("address")||null,current_system:g("current_system")||null,source:g("source")||null,notes:$("#f_notes").value||null};
      if(!row.name) return toast(t("required"));
      let d; if(s.id){d=await q(sb.from("institutions").update(row).eq("id",s.id).select().single());Object.assign(instById(s.id),d)}else{d=await q(sb.from("institutions").insert(row).select().single());S.insts.unshift(d)}
      toast(t("saved")); await openInst(d.id)};
    const del=$("#delInst"); if(del) del.onclick=async()=>{if(!del.dataset.armed){del.dataset.armed=1;del.textContent=t("confirmDel");return}await q(sb.from("institutions").delete().eq("id",s.id));await loadAll();closeSheet()};
  }
  if(s.kind==="opp"){
    const calc=()=>{const st=+$("#o_students").value||0,p=+$("#o_pps").value||0,dc=+$("#o_disc").value||0,cm=+$("#o_comm").value||0;const v=st*p*(1-dc/100);$("#o_val").textContent=money(v);$("#o_cv").textContent=money(v*cm/100)};
    ["o_students","o_pps","o_disc","o_comm"].forEach(k=>$("#"+k).oninput=calc); calc();
    $("#o_inst").onchange=e=>{const i=instById(e.target.value);if(i?.students_count&&!+$("#o_students").value){$("#o_students").value=i.students_count;calc()}};
    $("#oppForm").onsubmit=async e=>{e.preventDefault();
      const row={institution_id:$("#o_inst").value,name:$("#o_name").value,stage:$("#o_stage").value,students:+$("#o_students").value||0,price_per_student:+$("#o_pps").value||0,discount_pct:+$("#o_disc").value||0,commission_pct:+$("#o_comm").value||0,expected_close:$("#o_close").value||null,lost_reason:$("#o_lost").value||null,notes:$("#o_notes").value||null};
      if(!row.institution_id) return toast(t("inst"));
      const old=s.id&&S.opps.find(x=>x.id===s.id); const pv=$("#o_prob").value;
      if(pv!=="" && (!old || +pv!==old.probability || old.stage===row.stage)) row.probability=+pv;
      if(s.id){ if(old.stage!==row.stage && (pv===""||+pv===old.probability)) delete row.probability; await q(sb.from("opportunities").update(row).eq("id",s.id)) }
      else { await q(sb.from("opportunities").insert(row)); const i=instById(row.institution_id); if(i&&["new","contacted"].includes(i.status)){await sb.from("institutions").update({status:"qualified"}).eq("id",i.id)} }
      await loadAll(); toast(t("saved")); if(s.back) await openInst(s.back); else closeSheet() };
    const del=$("#delOpp"); if(del) del.onclick=async()=>{if(!del.dataset.armed){del.dataset.armed=1;del.textContent=t("confirmDel");return}await q(sb.from("opportunities").delete().eq("id",s.id));await loadAll();closeSheet()};
  }
  if(s.kind==="cad"){
    const wire=()=>sc.querySelectorAll(".st-del").forEach(b=>b.onclick=()=>b.closest(".step").remove()); wire();
    $("#addStep").onclick=()=>{const rows=sc.querySelectorAll(".step");const last=rows.length?+rows[rows.length-1].querySelector(".st-day").value:0;$("#cdSteps").insertAdjacentHTML("beforeend",stepRow({day:last+2,type:"call",title:""}));wire()};
    $("#cadForm").onsubmit=async e=>{e.preventDefault();const steps=[...sc.querySelectorAll(".step")].map(r=>({day:+r.querySelector(".st-day").value||0,type:r.querySelector(".st-type").value,title:r.querySelector(".st-title").value,hint:r.querySelector(".st-hint").value})).sort((a,b)=>a.day-b.day);
      const row={name:$("#cd_name").value,steps}; if(s.id) await q(sb.from("cadences").update(row).eq("id",s.id)); else await q(sb.from("cadences").insert(row));
      S.cadences=await q(sb.from("cadences").select("*").order("created_at"));toast(t("saved"));closeSheet()};
    const del=$("#delCad"); if(del) del.onclick=async()=>{if(!del.dataset.armed){del.dataset.armed=1;del.textContent=t("confirmDel");return}await q(sb.from("cadences").delete().eq("id",s.id));S.cadences=S.cadences.filter(c=>c.id!==s.id);closeSheet()};
  }
}
const clean = o => Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined&&v!==null&&v!==""));

/* ---------- boot ---------- */
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==S.view&&["today","leads","pipeline","forecast","agent","settings"].includes(h)){S.view=h;S.sheet=null;render()}});
sb.auth.onAuthStateChange(async(ev,session)=>{
  const u=session?.user||null;
  if(u && (!S.user || S.user.id!==u.id)){ S.user=u; await loadAll(); await loadChat(); render() }
  else if(!u){ S.user=null; render() }
});
render();
</script>
</body>
</html>
