<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wakeel">
<meta name="theme-color" content="#0F2A52">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Wakeel CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: navy sidebar + calm white workspace (desktop); bottom tabs + floating quick-add (phone).
   Palette is anchored on SchoolOS brand blue so the tool feels like part of what Ahmed sells. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EEF1F6; --hover:#F7F9FC; --line:#E3E8F0; --line-2:#D3DAE6;
  --ink:#0E1B2E; --ink-2:#334155; --muted:#677489; --faint:#94A0B4;
  --brand:#1B4B9B; --brand-2:#2A63C4; --brand-ink:#FFFFFF; --brand-soft:#E8EFFB; --brand-line:#C9D8F3;
  --nav:#0F2A52; --nav-2:#16386A; --nav-ink:#C9D6EC; --nav-on:#FFFFFF;
  --gold:#C9952B; --gold-soft:#FBF3E2;
  --good:#16794A; --good-soft:#E2F4EA; --warn:#B26A00; --warn-soft:#FDF0DC; --bad:#C2363B; --bad-soft:#FCE6E7; --info:#2C6DB5; --info-soft:#E4EEF9;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(15,27,46,.05); --sh-2:0 1px 3px rgba(15,27,46,.06),0 10px 30px -8px rgba(15,27,46,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1220; --surface:#111A2B; --sunk:#172236; --hover:#152036; --line:#1F2B42; --line-2:#2A3954;
  --ink:#E6ECF5; --ink-2:#C2CCDB; --muted:#8C9AB0; --faint:#66758D;
  --brand:#5B8DEF; --brand-2:#7AA3F3; --brand-ink:#06101F; --brand-soft:#16284A; --brand-line:#28457A;
  --nav:#0A1527; --nav-2:#13233F; --nav-ink:#9FB0CB; --nav-on:#FFFFFF;
  --gold:#E2B55A; --gold-soft:#33280F;
  --good:#4CC385; --good-soft:#12301F; --warn:#F0A83C; --warn-soft:#352610; --bad:#F07075; --bad-soft:#3A1719; --info:#6FA6E8; --info-soft:#132A45;
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 1px 3px rgba(0,0,0,.4),0 12px 32px -8px rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.3;letter-spacing:-.005em}
h1{font-size:1.45rem} h2{font-size:1.02rem} h3{font-size:.95rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.84rem} .xs{font-size:.76rem}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:18px 12px;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,#2A63C4,#1B4B9B);color:#fff;display:grid;place-items:center;font:700 1.15rem var(--f-display);position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.logo::after{content:"";position:absolute;top:5px;inset-inline-end:5px;width:6px;height:6px;border-radius:2px;background:#F2C14E;transform:rotate(45deg)}
.brand b{font:600 1.02rem var(--f-display);color:#fff;display:block;line-height:1.2}
.brand span{font-size:.74rem;color:var(--nav-ink)}
.side .label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#6F86AD;padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;border:0;background:none;text-align:start;width:100%;color:var(--nav-ink);font-weight:500;font-size:.93rem}
.nav:hover{background:var(--nav-2);color:#fff}
.nav.on{background:var(--nav-2);color:var(--nav-on);box-shadow:inset 3px 0 0 #5B8DEF}
[dir=rtl] .nav.on{box-shadow:inset -3px 0 0 #5B8DEF}
.nav .count{margin-inline-start:auto;font-size:.72rem;background:#C2363B;color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.side .spacer{flex:1}
.side .me{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid rgba(255,255,255,.08);margin-top:8px;font-size:.84rem}
.side .me .av{background:#2A63C4;color:#fff}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.searchbox{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:0 12px;height:38px;color:var(--muted)}
.searchbox:focus-within{border-color:var(--brand-line);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft)}
.searchbox input{border:0;background:none;outline:none;height:100%;padding:0;flex:1;min-width:0;color:var(--ink)}
.kbd{font-size:.7rem;border:1px solid var(--line-2);border-radius:5px;padding:0 5px;color:var(--faint)}
.topbar .grow{flex:1}
.content{flex:1;overflow:auto;padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phead .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.mbar,.tabbar,.fab{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side,.topbar{display:none}
  .main{height:100%}
  .mbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:5}
  .mbar .t{flex:1;font:600 1.05rem var(--f-display)}
  .content{padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-size:.68rem;color:var(--muted);padding:6px 0;font-weight:500;position:relative}
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--brand)}
  .tab .dot{position:absolute;top:2px;inset-inline-end:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:.62rem;line-height:16px;padding:0 4px}
  .fab{display:grid;place-items:center;position:fixed;z-index:21;width:54px;height:54px;border-radius:18px;background:var(--brand);color:var(--brand-ink);border:0;box-shadow:0 8px 24px -6px rgba(27,75,155,.55);
    bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px))}
  .fab svg{width:24px;height:24px}
  h1{font-size:1.3rem}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;height:36px;padding:0 14px;font-weight:500;font-size:.9rem;white-space:nowrap;color:var(--ink);text-decoration:none!important;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:var(--faint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{height:30px;padding:0 10px;font-size:.82rem;border-radius:8px}
.btn.icon{width:36px;padding:0} .btn.sm.icon{width:30px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wa{color:#128C4B} .btn.call{color:var(--info)} .btn.mail{color:#7A4FB5}
@media (prefers-color-scheme:dark){.btn.wa{color:#4CC385}.btn.mail{color:#B08AE6}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:600 .86rem var(--f-display);flex:none;color:#fff}
.av.lg{width:52px;height:52px;border-radius:14px;font-size:1.15rem}
.av.sm{width:28px;height:28px;border-radius:8px;font-size:.74rem}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--ink-2);line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain::before{display:none}
.s-new{background:var(--sunk);color:var(--muted)}
.s-contacted,.g-demo,.g-discovery{background:var(--info-soft);color:var(--info)}
.s-qualified,.g-proposal,.g-negotiation{background:var(--gold-soft);color:var(--warn)}
.s-customer,.g-won{background:var(--good-soft);color:var(--good)}
.s-unqualified,.s-lost,.g-lost,.p-overdue{background:var(--bad-soft);color:var(--bad)}
.p-draft,.p-due{background:var(--warn-soft);color:var(--warn)}
.score{font:600 .78rem var(--f-body);font-variant-numeric:tabular-nums;min-width:38px;height:24px;display:inline-grid;place-items:center;border-radius:7px;background:var(--sunk);color:var(--muted)}
.score.hi{background:var(--good-soft);color:var(--good)} .score.mid{background:var(--warn-soft);color:var(--warn)} .score.lo{background:var(--bad-soft);color:var(--bad)}
.empty{padding:36px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ill{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sec-h h2{display:flex;align-items:center;gap:8px}
.sec-h .n{font:500 .74rem var(--f-body);background:var(--sunk);color:var(--muted);border-radius:6px;padding:1px 7px}
.seg{display:inline-flex;gap:2px;background:var(--sunk);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--muted);white-space:nowrap;font-weight:500;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.seg .c{font-size:.72rem;color:var(--faint)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.kpi .v{font:600 1.55rem var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere;line-height:1.2}
.kpi .v small{font:500 .8rem var(--f-body);color:var(--muted);margin-inline-start:4px}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi.hero{background:linear-gradient(155deg,#16386A 0%,#1B4B9B 60%,#2A63C4 100%);color:#fff;border-color:transparent}
.kpi.hero .l,.kpi.hero .s,.kpi.hero .v small{color:rgba(255,255,255,.75)}
.meter{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.kpi.hero .meter{background:rgba(255,255,255,.18)}
.meter i{display:block;height:100%;background:var(--brand);border-radius:6px}
.kpi.hero .meter i{background:#F2C14E}
@media (max-width:820px){.kpi .v{font-size:1.25rem}.kpi{padding:14px}.kpi.hero{grid-column:1/-1}.kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.kpi:not(.hero){padding:12px}.kpi:not(.hero) .v{font-size:1.08rem}.kpi:not(.hero) .l{font-size:.72rem}}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.it{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--line);min-width:0}
.it:first-child{border-top:0}
.it.click{cursor:pointer} .it.click:hover{background:var(--hover)}
.it .t{font-weight:600;overflow-wrap:anywhere}
.it .m{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted)}
.ico.call{background:var(--info-soft);color:var(--info)} .ico.whatsapp{background:var(--good-soft);color:var(--good)}
.ico.email{background:#F1EAFB;color:#7A4FB5} .ico.meeting,.ico.visit{background:var(--gold-soft);color:var(--warn)} .ico.task,.ico.note{background:var(--sunk);color:var(--ink-2)}
@media (prefers-color-scheme:dark){.ico.email{background:#2A1F40;color:#B08AE6}}
.group-h{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 18px 4px;font-weight:600;background:var(--hover);border-top:1px solid var(--line)}
.group-h:first-child{border-top:0}
.group-h.bad{color:var(--bad)}
.draftbox{white-space:pre-wrap;background:var(--sunk);padding:12px 14px;border-radius:10px;font-size:.88rem;margin-top:8px;line-height:1.65;max-height:220px;overflow:auto}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:1fr}}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-size:.76rem;font-weight:600;color:var(--muted);text-align:start;padding:10px 14px;background:var(--hover);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.sorted{color:var(--ink)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer} .tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .namecell{display:flex;gap:10px;align-items:center;min-width:220px}
.tbl .namecell b{font-weight:600;display:block}
.cards{display:none}
@media (max-width:820px){.tbl-wrap{display:none}.cards{display:block}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto;height:36px;padding:0 10px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.79rem;color:var(--ink-2);font-weight:500}
.field .hint{font-size:.76rem;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0;height:38px;transition:border-color .12s,box-shadow .12s}
textarea{height:auto;resize:vertical;min-height:86px;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:600px){.g2,.g3{grid-template-columns:1fr}}
.form{display:flex;flex-direction:column;gap:14px}
.form-sec{font:600 .78rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:6px}

/* ---------- sheet (record drawer) ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,18,33,.45);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(720px,100%);height:100%;overflow:auto;box-shadow:var(--sh-2);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.sh-head{display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.sh-head .meta{font-size:.84rem;color:var(--muted)}
.sh-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
.sh-tabs::-webkit-scrollbar{display:none}
.sh-tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;font-size:.9rem}
.sh-tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.sh-body{padding:18px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick .btn{height:auto;flex-direction:column;padding:10px 4px;gap:4px;font-size:.78rem;border-radius:12px}
.quick .btn svg{width:20px;height:20px}
@media (max-width:820px){.scrim{align-items:flex-end}.sheet{height:95%;border-radius:18px 18px 0 0}.sh-top{border-radius:18px 18px 0 0;padding-top:10px}.sh-top::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 10px}}

/* Salesforce-style path */
.path{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.path::-webkit-scrollbar{display:none}
.path button{flex:1;min-width:max-content;border:0;background:var(--sunk);color:var(--muted);font-size:.78rem;font-weight:600;padding:8px 14px;position:relative;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
[dir=rtl] .path button{clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 50%,100% 100%,10px 100%,0 50%)}
.path button:first-child{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);border-radius:8px 0 0 8px}
[dir=rtl] .path button:first-child{clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);border-radius:0 8px 8px 0}
.path button.done{background:var(--brand-soft);color:var(--brand)}
.path button.cur{background:var(--brand);color:var(--brand-ink)}
.path button.lost.cur{background:var(--bad);color:#fff}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:10px 16px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.tl{position:relative;display:flex;flex-direction:column}
.tl .it{border:0;padding:10px 0}
.tl .it .ico{position:relative;z-index:1}
.tl::before{content:"";position:absolute;top:18px;bottom:18px;inset-inline-start:16px;width:2px;background:var(--line)}

/* ---------- pipeline ---------- */
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.funnel div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.funnel .l{font-size:.76rem;color:var(--muted)} .funnel .v{font:600 1.02rem var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.funnel .c{font-size:.74rem;color:var(--faint)}
@media (max-width:900px){.funnel{grid-template-columns:repeat(3,minmax(0,1fr))}}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 6px}
.col-h b{font:600 .88rem var(--f-display);display:flex;gap:7px;align-items:center}
.col-h b i{width:8px;height:8px;border-radius:50%;display:inline-block}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh-1);transition:border-color .12s,transform .12s}
.deal:hover{border-color:var(--brand-line);transform:translateY(-1px)}
.deal .amt{font:600 1rem var(--f-display);font-variant-numeric:tabular-nums}
.deal .foot{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.prob{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prob i{display:block;height:100%;background:var(--brand)}
.board-m{display:none}
@media (max-width:820px){.board{display:none}.board-m{display:flex;flex-direction:column;gap:12px}}

/* ---------- forecast ---------- */
.chart{padding:18px;display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center}
.bar-track{position:relative;height:30px;background:var(--sunk);border-radius:8px;overflow:hidden}
.bar-track .o{position:absolute;inset-block:0;inset-inline-start:0;background:var(--brand-soft)}
.bar-track .w{position:absolute;inset-block:0;inset-inline-start:0;background:var(--brand);border-radius:8px}
.bar-track .tg{position:absolute;inset-block:-2px;width:2px;background:var(--gold)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding:0 18px 16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
table.qt{width:100%;border-collapse:collapse;min-width:620px;font-size:.88rem}
.qt th,.qt td{padding:11px 16px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.qt th{font-size:.75rem;color:var(--muted);font-weight:600;background:var(--hover)}
.qt td{font-variant-numeric:tabular-nums}
.qt tr.cur td{background:var(--brand-soft)}

/* ---------- agent ---------- */
.agent{display:grid;grid-template-rows:auto 1fr auto;gap:14px;height:100%;max-width:860px;margin:0 auto}
.agent-wrap{height:100%}
.msgs{overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px;min-height:240px}
.msg{display:flex;gap:10px;max-width:92%}
.msg .b{padding:11px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:.94rem}
.msg.assistant .b{background:var(--surface);border:1px solid var(--line);border-start-start-radius:4px}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.user .b{background:var(--brand);color:var(--brand-ink);border-start-end-radius:4px}
.msg .meta{display:block;margin-top:6px;font-size:.72rem;color:var(--muted)}
.msg .av{width:30px;height:30px;border-radius:9px;font-size:.8rem}
.bot-av{background:linear-gradient(160deg,#2A63C4,#1B4B9B)}
.typing .b{display:flex;gap:4px;align-items:center}
.typing .b i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing .b i:nth-child(2){animation-delay:.2s}.typing .b i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.sugs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:600px){.sugs{grid-template-columns:1fr}}
.sug{display:flex;gap:10px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;color:var(--ink-2);font-size:.86rem}
.sug:hover{border-color:var(--brand-line);background:var(--hover)}
.sug .ico{width:30px;height:30px;background:var(--brand-soft);color:var(--brand)}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:8px;box-shadow:var(--sh-1)}
.composer:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.composer textarea{resize:none;border:0;min-height:44px;max-height:170px;padding:9px;box-shadow:none!important}
.composer .btn{width:42px;height:42px;padding:0;border-radius:12px;flex:none}
.costline{font-size:.74rem;color:var(--muted);text-align:center}

.auth-art p{color:rgba(255,255,255,.78);max-width:42ch}
.auth-art ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;color:rgba(255,255,255,.88)}

/* ================= forecast ================= */
function forecastRows(){
  const by={},add=k=>by[k]??={deals:0,value:0,weighted:0,commW:0,won:0,commWon:0,commOpen:0};
  for(const o of S.opps){if(o.stage==="lost")continue;const k=o.stage==="won"?(qOf(o.closed_at)||"–"):(qOf(o.expected_close)||"–"),b=add(k);b.deals++;
    if(o.stage==="won"){b.won+=+o.amount;b.commWon+=+o.commission}else{b.value+=+o.amount;b.weighted+=o.amount*o.probability/100;b.commW+=o.commission*o.probability/100;b.commOpen+=+o.commission}}
  const d=new Date();for(let i=0;i<4;i++)add(qOf(new Date(d.getFullYear(),d.getMonth()+i*3,1)));
  return Object.entries(by).sort(([a],[b])=>a==="–"?1:b==="–"?-1:a.localeCompare(b))}
function forecastView(){
  const rows=forecastRows(),tgt=Number(S.settings.quarterly_target_egp||0),cq=curQ();
  const max=Math.max(1,tgt,...rows.map(([,b])=>b.commWon+b.commOpen));
  const totExp=rows.reduce((a,[,b])=>a+b.commW+b.commWon,0);
  return `<div class="page">${phead(t("forecast"),`${t("commW")}: ${money(totExp)}`)}
   <section class="card"><div class="sec-h"><h2>${t("fcH")}</h2></div>
    <div class="chart">${rows.filter(([k])=>k!=="–").map(([k,b])=>{const firm=b.commWon+b.commW,pot=b.commWon+b.commOpen;
      return `<div class="bar-row"><span class="small num" style="font-weight:${k===cq?600:400}">${k}</span><div class="bar-track"><div class="o" style="width:${pot/max*100}%"></div><div class="w" style="width:${Math.max(firm?1.5:0,firm/max*100)}%"></div>${tgt?`<div class="tg" style="inset-inline-start:${tgt/max*100}%"></div>`:""}</div><span class="small num" style="min-width:90px;text-align:end;font-weight:600">${money(firm)}</span></div>`}).join("")}</div>
    <div class="legend"><span><i style="background:var(--brand)"></i>${t("commW")}</span><span><i style="background:var(--brand-soft);border:1px solid var(--brand-line)"></i>${t("potential")}</span>${tgt?`<span><i style="background:var(--gold);width:3px"></i>${t("target")} ${money(tgt)}</span>`:""}</div></section>
   <section class="card" style="overflow:hidden"><div class="sec-h"><h2>${t("fcTable")}</h2></div><div class="tbl-wrap" style="display:block"><table class="qt"><thead><tr><th>${t("quarter")}</th><th>${t("dealsH")}</th><th>${t("value")}</th><th>${t("weighted")}</th><th>${t("wonV")}</th><th>${t("commW")}</th><th>${t("commWon")}</th></tr></thead>
    <tbody>${rows.map(([k,b])=>`<tr class="${k===cq?"cur":""}"><td>${k==="–"?t("noDate"):k}</td><td>${b.deals}</td><td>${fmt(b.value)}</td><td>${fmt(b.weighted)}</td><td>${fmt(b.won)}</td><td><b>${fmt(b.commW+b.commWon)}</b></td><td>${fmt(b.commWon)}</td></tr>`).join("")}</tbody></table></div>

    ["o_students","o_pps","o_disc","o_comm"].forEach(k=>$("#"+k).oninput=calc);calc();
    $$("#o_path [data-stage]",sc).forEach(b=>b.onclick=()=>{const v=b.dataset.stage,ci=STAGES.indexOf(v);$("#o_stage").value=v;$$("#o_path [data-stage]",sc).forEach((x,ix)=>{x.className=(x.dataset.stage==="lost"?"lost ":"")+(v==="lost"?(x.dataset.stage==="lost"?"cur":""):(ix<ci?"done":ix===ci?"cur":""))});$("#o_lostWrap").hidden=v!=="lost"});
    $("#o_inst").onchange=e=>{const i=instById(e.target.value);if(i?.students_count&&!+$("#o_students").value){$("#o_students").value=i.students_count;calc()}};
    $("#oppForm").onsubmit=async e=>{e.preventDefault();
      const row={institution_id:$("#o_inst").value,name:$("#o_name").value,stage:$("#o_stage").value,students:+$("#o_students").value||0,price_per_student:+$("#o_pps").value||0,discount_pct:+$("#o_disc").value||0,commission_pct:+$("#o_comm").value||0,expected_close:$("#o_close").value||null,lost_reason:$("#o_lost").value||null,notes:$("#o_notes").value||null};
      if(!row.institution_id)return toast(t("inst"));
      const old=s.id&&S.opps.find(x=>x.id===s.id),pv=$("#o_prob").value;
      if(pv!==""&&(!old||+pv!==old.probability||old.stage===row.stage))row.probability=+pv;
      if(s.id){if(old.stage!==row.stage&&(pv===""||+pv===old.probability))delete row.probability;await q(sb.from("opportunities").update(row).eq("id",s.id))}
      else{await q(sb.from("opportunities").insert(row));const i=instById(row.institution_id);if(i&&["new","contacted"].includes(i.status))await sb.from("institutions").update({status:"qualified"}).eq("id",i.id)}
      await loadAll();toast("✓ "+t("saved"));if(s.back)openInst(s.back);else closeSheet()};
    const del=$("#delOpp");if(del)del.onclick=()=>arm(del,async()=>{await q(sb.from("opportunities").delete().eq("id",s.id));await loadAll();closeSheet()});
  }
  if(s.kind==="cad"){
    const wire=()=>$$(".st-del",sc).forEach(b=>b.onclick=()=>b.closest(".step").remove());wire();
    $("#addStep").onclick=()=>{const rows=$$(".step",sc),last=rows.length?+rows[rows.length-1].querySelector(".st-day").value:0;$("#cdSteps").insertAdjacentHTML("beforeend",stepRow({day:last+2,type:"call",title:""}));wire()};
    $("#cadForm").onsubmit=async e=>{e.preventDefault();const steps=$$(".step",sc).map(r=>({day:+r.querySelector(".st-day").value||0,type:r.querySelector(".st-type").value,title:r.querySelector(".st-title").value,hint:r.querySelector(".st-hint").value})).sort((a,b)=>a.day-b.day);
      const row={name:$("#cd_name").value,steps};if(s.id)await q(sb.from("cadences").update(row).eq("id",s.id));else await q(sb.from("cadences").insert(row));
      S.cadences=await q(sb.from("cadences").select("*").order("created_at"));toast("✓ "+t("saved"));closeSheet()};
    const del=$("#delCad");if(del)del.onclick=()=>arm(del,async()=>{await q(sb.from("cadences").delete().eq("id",s.id));S.cadences=S.cadences.filter(c=>c.id!==s.id);closeSheet()});
  }
}

/* ================= boot ================= */
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==S.view)go(h)});
// Supabase holds an auth lock while this callback runs: never await Supabase calls inside it (that deadlocks). Defer instead.
async function boot(u){S.user=u;S.loaded=false;render();
  try{await loadAll()}catch(e){console.error(e)}
  try{await loadChat()}catch(e){}
  S.loaded=true;render()}
sb.auth.onAuthStateChange((ev,session)=>{const u=session?.user||null;
  if(u&&(!S.user||S.user.id!==u.id))setTimeout(()=>boot(u),0);
  else if(u)S.user=u;
  else{S.user=null;S.loaded=false;setTimeout(render,0)}});
render();
</script>
</body>
